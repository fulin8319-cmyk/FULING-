","fabricType":"","color":"灰色","composition":"請洽詢","category":"其他布料","width":56,"weight":138,"kg":0,"yards":0,"status":"confirmed","printing":false,"images":["https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/0qtLD3aoq5svUvrhKTwS/pub/crg5BNpskvYjjwh5V2kx.jpg"]},{"code":"A922573","title":"A922573","fabricType":"","color":"黑色","composition":"請洽詢","category":"其他布料","width":64,"weight":214,"kg":19,"yards":88.8,"status":"confirmed","printing":false,"images":["https://storage.googleapis.com/glide-prod.appspot.com/uploads-v2/0qtLD3aoq5svUvrhKTwS/pub/wD4c9jqBa0sHvMQxA7Zh.jpg"]}]</script>
<script>
let products=JSON.parse(document.getElementById('inventoryData').textContent);products.forEach(product=>{if(/^0\d+$/.test(product.code))product.code='A'+product.code});
const translations={zh:{back:'返回首頁',ask:'加 LINE 問價格',title:'全部現貨瀏覽',intro:'依商品編號、布種、顏色、材質與分類搜尋。頁面只顯示客戶需要的商品資訊；逐支重量、庫位與內部管理資料不公開。',products:'款可瀏覽布料',searchLabel:'搜尋',searchPlaceholder:'商品編號、品名、布種、顏色、材質',category:'分類',fabricType:'布種',color:'顏色',printing:'印花用途',all:'全部',printingYes:'熱昇華印花用布',printingNo:'其他布料',clear:'清除篩選',notice:'資料由福麟正式庫存即時載入，逐支紀錄、庫位與內部管理資料不公開。實際數量、售出、保留與補貨狀態請加 LINE 確認；價格一律透過 LINE 詢價。',more:'顯示更多',result:n=>`顯示 ${n} 款布料`,width:'幅寬',weight:'碼重',stock:'現貨',askItem:'加 LINE 詢問這款',noResult:'找不到符合條件的布料',photo:'實拍照片',confirmed:'現貨',review:'數量請洽詢'},en:{back:'Back to homepage',ask:'Ask on LINE',title:'Browse All In-Stock Fabrics',intro:'Search by item code, fabric type, color, composition, and category. Roll-level weights, warehouse locations, and internal management data are not public.',products:'browsable fabrics',searchLabel:'Search',searchPlaceholder:'Code, name, fabric, color, composition',category:'Category',fabricType:'Fabric type',color:'Color',printing:'Printing use',all:'All',printingYes:'Sublimation-printing fabrics',printingNo:'Other fabrics',clear:'Clear filters',notice:'Data is loaded from FULIN’s live inventory. Roll-level records, warehouse locations, and internal management data are not public. Confirm actual quantity, sales, reservations, replenishment, and prices through LINE.',more:'Show more',result:n=>`Showing ${n} fabrics`,width:'Width',weight:'Weight / yd',stock:'Stock',askItem:'Ask about this fabric',noResult:'No matching fabrics found',photo:'Fabric photo',confirmed:'In stock',review:'Ask for quantity'}};
let lang='zh',limit=48,filtered=[];
const grid=document.getElementById('productGrid'),searchInput=document.getElementById('searchInput'),categoryFilter=document.getElementById('categoryFilter'),fabricFilter=document.getElementById('fabricFilter'),colorFilter=document.getElementById('colorFilter'),printingFilter=document.getElementById('printingFilter'),resultCount=document.getElementById('resultCount'),loadMoreButton=document.getElementById('loadMoreButton');
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const options=(select,values)=>{select.innerHTML=`<option value="">${translations[lang].all}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true})).map(value=>`<option value="${esc(value)}">${esc(value)}</option>`).join('')};
options(categoryFilter,products.map(p=>p.category));options(fabricFilter,products.map(p=>p.fabricType));options(colorFilter,products.map(p=>p.color));
function lineUrl(code=''){const message=`您好，我想詢問布料：\n商品編號：${code}\n用途：\n預計數量：\n顏色：\n是否用於熱昇華印刷：`;return 'https://line.me/R/oaMessage/%40424tvsxa/?'+encodeURIComponent(message)}
function stockText(p){const parts=[];if(p.kg)parts.push(p.kg.toLocaleString()+' kg');if(p.yards)parts.push(p.yards.toLocaleString()+' yd');return parts.join(' / ')||translations[lang].review}
function card(p){const photo=p.images[0]?`<img loading="lazy" src="${esc(p.images[0])}" alt="${esc(p.title)} ${translations[lang].photo}">`:`<div class="photo-empty">${translations[lang].photo}</div>`;return `<article class="card"><div class="photo" data-image="${esc(p.images[0]||'')}" data-caption="${esc(p.code+' '+p.title)}">${photo}<span class="code">${esc(p.code)}</span></div><div class="card-body"><h2>${esc(p.title)}</h2><div class="badges"><span class="badge">${esc(p.fabricType||p.category)}</span><span class="badge secondary">${p.printing?translations[lang].printingYes:esc(p.category)}</span></div><div class="specs"><div class="spec"><span>${translations[lang].color}</span><strong>${esc(p.color)}</strong></div><div class="spec"><span>${lang==='zh'?'材質':'Composition'}</span><strong>${esc(p.composition)}</strong></div><div class="spec"><span>${translations[lang].width}</span><strong>${p.width?p.width+'″':'—'}</strong></div><div class="spec"><span>${translations[lang].weight}</span><strong>${p.weight?p.weight+' g/yd':'—'}</strong></div><div class="spec" style="grid-column:1/-1"><span>${translations[lang].stock}</span><strong>${stockText(p)}</strong></div></div><a class="ask" href="${lineUrl(p.code)}" target="_blank" rel="noopener">${translations[lang].askItem}</a></div></article>`}
function apply(){const query=searchInput.value.trim().toLowerCase().replace(/^a(?=\d)/,'');filtered=products.filter(p=>{const hay=[p.code,p.title,p.fabricType,p.color,p.composition,p.category].join(' ').toLowerCase().replace(/^a(?=\d)/,'');return(!query||hay.includes(query))&&(!categoryFilter.value||p.category===categoryFilter.value)&&(!fabricFilter.value||p.fabricType===fabricFilter.value)&&(!colorFilter.value||p.color===colorFilter.value)&&(!printingFilter.value||(printingFilter.value==='yes')===p.printing)});resultCount.textContent=translations[lang].result(filtered.length);grid.innerHTML=filtered.length?filtered.slice(0,limit).map(card).join(''):`<div class="empty">${translations[lang].noResult}</div>`;loadMoreButton.hidden=limit>=filtered.length}
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{const key=el.dataset.i18n;if(typeof translations[lang][key]==='string')el.textContent=translations[lang][key]});searchInput.placeholder=translations[lang].searchPlaceholder;document.getElementById('languageButton').textContent=lang==='zh'?'EN':'中文';document.getElementById('headerLine').href=lineUrl();options(categoryFilter,products.map(p=>p.category));options(fabricFilter,products.map(p=>p.fabricType));options(colorFilter,products.map(p=>p.color));printingFilter.options[0].textContent=translations[lang].all;printingFilter.options[1].textContent=translations[lang].printingYes;printingFilter.options[2].textContent=translations[lang].printingNo;apply()}
function normalizeCode(value){const code=String(value||'').trim();return /^0\d+$/.test(code)?'A'+code:code}
function uniqueImages(item){return[...(Array.isArray(item.images)?item.images:[]),item.featuredImage,item.image].map(value=>String(value||'').trim()).filter((value,index,list)=>value&&list.indexOf(value)===index)}
function cleanPublicText(value,fallback=''){const text=String(value||'').trim();return !text||text.includes('\uFFFD')?fallback:text}
function toPublicProduct(item){const status=String(item.status||'').toLowerCase();if(status.includes('sold')||status.includes('售完'))return null;const code=normalizeCode(item.code);if(!code)return null;const isNopCooling=code==='A023811';return{code,title:cleanPublicText(item.displayTitle||item.name||item.fabricType,code),fabricType:cleanPublicText(item.fabricType),color:cleanPublicText(item.pattern||item.color,'請洽詢'),composition:cleanPublicText(item.composition,'請洽詢'),category:isNopCooling?'機能性成衣布':cleanPublicText(item.category,'其他布料'),width:Number(item.width)||0,weight:Number(item.weightPerYard)||0,kg:Number(item.kg)||0,yards:Number(item.yards)||0,status:item.status||'confirmed',printing:isNopCooling?false:Boolean(item.isPrintingFabric),images:uniqueImages(item),featured:Boolean(item.featuredOnHome),featuredOrder:Number(item.featuredOrder)||0}}
function productScore(product){return(product.images.length*6)+(product.title!==product.code?5:0)+(product.fabricType?3:0)+(product.color!=='請洽詢'?3:0)+(product.composition!=='請洽詢'?3:0)+(product.width?2:0)+(product.weight?2:0)+(product.kg||product.yards?2:0)}
function groupPublicProducts(items){const grouped=new Map();items.map(toPublicProduct).filter(Boolean).forEach(product=>{const current=grouped.get(product.code);if(!current){grouped.set(product.code,product);return}const preferred=productScore(product)>productScore(current)?product:current;preferred.images=[...new Set([...current.images,...product.images])];preferred.kg=Math.max(current.kg,product.kg);preferred.yards=Math.max(current.yards,product.yards);preferred.featured=current.featured||product.featured;preferred.featuredOrder=current.featuredOrder||product.featuredOrder;grouped.set(product.code,preferred)});return[...grouped.values()].sort((a,b)=>(Number(b.featured)-Number(a.featured))||(a.featuredOrder-b.featuredOrder)||a.code.localeCompare(b.code,'zh-Hant',{numeric:true}))}
async function loadLiveProducts(){try{const response=await fetch('/api/inventory',{cache:'no-store'});if(!response.ok)throw new Error('Inventory request failed');const payload=await response.json();const rows=Array.isArray(payload)?payload:payload.items;if(!Array.isArray(rows)||!rows.length)throw new Error('Inventory is empty');products=groupPublicProducts(rows);document.getElementById('totalProducts').textContent=products.length.toLocaleString();limit=48;translate()}catch(error){console.warn('使用頁面內的備用現貨資料。',error)}}
[searchInput,categoryFilter,fabricFilter,colorFilter,printingFilter].forEach(el=>{el.addEventListener('input',()=>{limit=48;apply()});el.addEventListener('change',()=>{limit=48;apply()})});document.getElementById('clearButton').addEventListener('click',()=>{searchInput.value='';categoryFilter.value='';fabricFilter.value='';colorFilter.value='';printingFilter.value='';limit=48;apply()});loadMoreButton.addEventListener('click',()=>{limit+=48;apply()});document.getElementById('languageButton').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';translate()});
const modal=document.getElementById('imageModal'),modalImage=document.getElementById('modalImage'),modalCaption=document.getElementById('modalCaption');grid.addEventListener('click',event=>{const photo=event.target.closest('[data-image]');if(!photo?.dataset.image)return;modalImage.src=photo.dataset.image;modalImage.alt=photo.dataset.caption;modalCaption.textContent=photo.dataset.caption;modal.hidden=false});function closeModal(){modal.hidden=true;modalImage.removeAttribute('src')}document.getElementById('modalClose').addEventListener('click',closeModal);modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeModal()});translate();loadLiveProducts();
</script>
</body>
