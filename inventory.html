<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福麟商行 | 現貨查詢</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand-mark" href="./index.html">
        <span class="brand-text">
          <span class="brand-cn">福麟商行</span>
          <span class="brand-en">Fulin Textile</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="./index.html">首頁</a>
        <a href="./index.html#about">關於我們</a>
        <a href="./printing.html">印花用布</a>
        <a href="./login.html">後台登入</a>
        <a class="nav-cta" href="./inventory.html">現貨查詢</a>
      </nav>
    </header>

    <main class="inventory-page">
      <section class="inventory-hero">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>現貨布料查詢</h1>
          <p class="hero-lead">
            這裡整理目前的現貨布料資料，你可以依布號、狀態與基本資訊快速查找，
            也可以點開卡片預覽布樣圖片。
          </p>
        </div>
        <div class="hero-stats">
          <div class="stat-card">
            <span class="stat-label">Records</span>
            <strong id="recordCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Needs Review</span>
            <strong id="reviewCount">0</strong>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <label class="field">
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="輸入布號、品名或關鍵字">
        </label>
        <label class="field">
          <span>狀態</span>
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="confirmed">已確認</option>
            <option value="review">待確認</option>
            <option value="sold">已售出</option>
            <option value="reserved">保留中</option>
          </select>
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sortSelect">
            <option value="code">布號</option>
            <option value="yards">碼數</option>
            <option value="kg">公斤數</option>
            <option value="width">幅寬</option>
          </select>
        </label>
      </section>

      <section class="summary-strip" id="summaryStrip"></section>

      <section class="content-grid">
        <div class="table-panel">
          <div class="panel-head">
            <h2>現貨資料表</h2>
            <p>可快速瀏覽主要欄位，再搭配右側卡片查看布樣。</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>布號</th>
                  <th>品名</th>
                  <th>碼重</th>
                  <th>公斤數</th>
                  <th>自動換算碼數</th>
                  <th>庫存位置</th>
                  <th>狀態</th>
                  <th>分類</th>
                </tr>
              </thead>
              <tbody id="inventoryRows"></tbody>
            </table>
          </div>
        </div>

        <aside class="card-panel">
          <div class="panel-head">
            <h2>布樣卡片</h2>
            <p>點擊卡片可看較大預覽，方便快速辨識布樣。</p>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="previewModal" class="preview-modal">
    <button id="closeModal" class="close-button" aria-label="Close">x</button>
    <div class="modal-layout">
      <div class="modal-swatch" id="modalSwatch"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
