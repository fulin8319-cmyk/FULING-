<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福麟商行｜印花用布現貨查詢</title>
  <meta name="description" content="福麟商行印花用布現貨查詢，可依布號、布種、顏色、成份與狀態快速篩選。">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="site-shell inventory-page">
    <header class="site-header compact-header">
      <a class="brand-mark" href="./index.html">
        <span class="brand-cn">福麟商行</span>
        <span class="brand-en">Fulin Textile</span>
      </a>
      <nav class="site-nav">
        <a href="./index.html">首頁</a>
        <a href="./printing.html">印花用布</a>
        <a class="nav-cta" href="./login.html">後台登入</a>
      </nav>
    </header>

    <section class="inventory-hero">
      <div>
        <p class="section-kicker">INVENTORY</p>
        <h1>印花用布現貨查詢</h1>
        <p>
          可直接搜尋布號、布種、顏色、成份與庫存資訊。搜尋時可不輸入開頭 A，
          例如輸入 <code>023811</code> 也可找到 <code>A023811</code>。
        </p>
      </div>
      <div class="inventory-badges">
        <div class="badge-card">
          <span>顯示筆數</span>
          <strong id="resultCount">0</strong>
        </div>
        <div class="badge-card">
          <span>已售出</span>
          <strong id="soldCount">0</strong>
        </div>
      </div>
    </section>

    <section class="filter-panel">
      <div class="filter-grid">
        <label>
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="輸入布號、布種、顏色、成份">
        </label>
        <label>
          <span>狀態</span>
          <select id="statusFilter"></select>
        </label>
        <label>
          <span>布種</span>
          <select id="fabricTypeFilter"></select>
        </label>
        <label>
          <span>顏色</span>
          <select id="colorFilter"></select>
        </label>
        <label>
          <span>分類</span>
          <select id="categoryFilter"></select>
        </label>
        <label>
          <span>成份</span>
          <select id="compositionFilter"></select>
        </label>
        <label>
          <span>排序</span>
          <select id="sortSelect">
            <option value="code-asc">布號（小到大）</option>
            <option value="code-desc">布號（大到小）</option>
            <option value="kg-desc">公斤（高到低）</option>
            <option value="yards-desc">碼數（高到低）</option>
          </select>
        </label>
      </div>
    </section>

    <section class="summary-panel">
      <div class="summary-card">
        <span>總公斤數</span>
        <strong id="totalKg">0 kg</strong>
      </div>
      <div class="summary-card">
        <span>總碼數</span>
        <strong id="totalYards">0 yd</strong>
      </div>
      <div class="summary-card">
        <span>最大幅寬</span>
        <strong id="maxWidth">0"</strong>
      </div>
      <div class="summary-card">
        <span>分類數量</span>
        <strong id="categoryCount">0</strong>
      </div>
    </section>

    <section class="inventory-content">
      <div class="inventory-table-panel">
        <div class="panel-header">
          <h2>庫存列表</h2>
          <p>左側顯示主要欄位，右側卡片可放大查看布樣。</p>
        </div>
        <div class="table-wrapper">
          <table class="inventory-table">
            <thead>
              <tr>
                <th>縮圖</th>
                <th>布號</th>
                <th>布種</th>
                <th>顏色</th>
                <th>分類</th>
                <th>成份</th>
                <th>幅寬</th>
                <th>碼重</th>
                <th>公斤數</th>
                <th>碼數</th>
                <th>庫位</th>
                <th>狀態</th>
              </tr>
            </thead>
            <tbody id="inventoryRows"></tbody>
          </table>
        </div>
      </div>

      <div class="inventory-card-panel">
        <div class="panel-header">
          <h2>布樣卡片</h2>
          <p>同布號只顯示一筆最佳資料，避免重複與錯圖。</p>
        </div>
        <div id="cardGrid" class="card-grid"></div>
      </div>
    </section>
  </div>

  <div id="previewModal" class="preview-modal" hidden>
    <div class="preview-dialog">
      <button id="closePreview" class="preview-close" type="button" aria-label="關閉">×</button>
      <img id="previewImage" src="" alt="布樣放大圖">
      <div class="preview-caption">
        <strong id="previewTitle"></strong>
        <p id="previewMeta"></p>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
