<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福麟商行 | 現貨查詢</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand-mark" href="./index.html">
        <span class="brand-text">
          <span class="brand-cn">福麟商行</span>
          <span class="brand-en">Fulin Textile</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="./index.html">首頁</a>
        <a href="./index.html#about">關於我們</a>
        <a href="./printing.html">印花用布</a>
        <a href="./login.html">後台登入</a>
        <a class="nav-cta" href="./inventory.html">現貨查詢</a>
      </nav>
    </header>

    <main class="inventory-page">
      <section class="inventory-hero">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>現貨布料庫存查詢</h1>
          <p class="hero-lead">
            這一頁會同步顯示目前在庫的布料。現在也支援同布號多支庫存，
            所以你可以看到主布號、支號、公斤數、碼數與庫位分開管理。
          </p>
        </div>
        <div class="hero-stats">
          <div class="stat-card">
            <span class="stat-label">Records</span>
            <strong id="recordCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Needs Review</span>
            <strong id="reviewCount">0</strong>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <label class="field">
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="搜尋布號、主布號、支號、庫位">
        </label>
        <label class="field">
          <span>狀態</span>
          <select id="statusFilter">
            <option value="all">全部</option>
            <option value="confirmed">現貨中</option>
            <option value="review">待確認</option>
            <option value="sold">已售出</option>
            <option value="reserved">保留中</option>
          </select>
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sortSelect">
            <option value="code">布號</option>
            <option value="yards">碼數</option>
            <option value="kg">公斤數</option>
            <option value="width">幅寬</option>
          </select>
        </label>
      </section>

      <section class="summary-strip" id="summaryStrip"></section>

      <section class="content-grid">
        <div class="table-panel">
          <div class="panel-head">
            <h2>庫存列表</h2>
            <p>點縮圖可以放大看布樣。若同一個布號有多支，會在主布號與支號欄位清楚分開。</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>縮圖</th>
                  <th>布號</th>
                  <th>主布號</th>
                  <th>支號</th>
                  <th>幅寬</th>
                  <th>碼重</th>
                  <th>公斤數</th>
                  <th>碼數</th>
                  <th>庫位</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="inventoryRows"></tbody>
            </table>
          </div>
        </div>

        <aside class="card-panel">
          <div class="panel-head">
            <h2>布樣卡片</h2>
            <p>快速瀏覽目前現貨與同布號多支明細。</p>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="previewModal" class="preview-modal">
    <button id="closeModal" class="close-button" aria-label="Close">x</button>
    <div class="modal-layout">
      <div class="modal-swatch" id="modalSwatch"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
