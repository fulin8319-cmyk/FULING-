<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福麟商行 | 現貨庫存</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand-mark" href="./index.html">
        <span class="brand-cn">福麟商行</span>
        <span class="brand-en">Fulin Textile</span>
      </a>
      <nav class="site-nav">
        <a href="./index.html">首頁</a>
        <a href="./index.html#about">關於我們</a>
        <a href="./printing.html">印花用布</a>
        <a href="./login.html">後台登入</a>
        <a class="nav-cta" href="./inventory.html">現貨庫存</a>
      </nav>
    </header>

    <main class="inventory-page">
      <section class="inventory-hero">
        <div>
          <p class="eyebrow">Inventory</p>
          <h1>現貨布料庫存</h1>
          <p class="hero-lead">
            這裡可以直接查詢目前現貨布料的編號、幅寬、碼重、公斤數、碼數與庫存位置。
            點布樣圖可放大看，方便快速比對。
          </p>
        </div>
        <div class="hero-stats">
          <div class="stat-card">
            <span class="stat-label">Records</span>
            <strong id="recordCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Needs Review</span>
            <strong id="reviewCount">0</strong>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <label class="field">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="搜尋編號、幅寬、碼重、庫位">
        </label>
        <label class="field">
          <span>Status</span>
          <select id="statusFilter">
            <option value="all">All</option>
            <option value="confirmed">Confirmed</option>
            <option value="review">Review</option>
            <option value="sold">Sold</option>
            <option value="reserved">Reserved</option>
          </select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="code">Code</option>
            <option value="yards">Yards</option>
            <option value="kg">KG</option>
            <option value="width">Width</option>
          </select>
        </label>
      </section>

      <section class="summary-strip" id="summaryStrip"></section>

      <section class="content-grid">
        <div class="table-panel">
          <div class="panel-head">
            <h2>庫存列表</h2>
            <p>點任何布樣縮圖都可以放大查看。</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>布樣</th>
                  <th>編號</th>
                  <th>幅寬</th>
                  <th>碼重</th>
                  <th>公斤數</th>
                  <th>碼數</th>
                  <th>庫位</th>
                  <th>狀態</th>
                </tr>
              </thead>
              <tbody id="inventoryRows"></tbody>
            </table>
          </div>
        </div>

        <aside class="card-panel">
          <div class="panel-head">
            <h2>布樣卡片</h2>
            <p>用圖片快速瀏覽色系、材質與現貨狀態。</p>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="previewModal" class="preview-modal">
    <button id="closeModal" class="close-button" aria-label="Close">x</button>
    <div class="modal-layout">
      <div class="modal-swatch" id="modalSwatch"></div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
