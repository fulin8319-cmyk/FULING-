<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福麟商行 | 手機快速入庫</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand-mark" href="./index.html">
        <span>
          <span class="brand-cn">福麟商行</span>
          <span class="brand-en">Fulin Textile</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="./index.html">首頁</a>
        <a href="./inventory.html">現貨查詢</a>
        <a href="./admin.html">後台</a>
        <button id="logoutButton" class="secondary-button" type="button">登出</button>
      </nav>
    </header>

    <main class="admin-page">
      <section class="inventory-hero">
        <div>
          <p class="eyebrow">Mobile Entry</p>
          <h1>手機快速入庫</h1>
          <p class="hero-lead">
            在手機上先填一次主資料，再往下連續新增多支布料。每一支可以有不同公斤數、碼數、庫位與狀態。
          </p>
          <p class="hero-lead">
            這一版也支援直接拍照上傳。圖片會先在手機端壓縮，再一起送進庫存系統。
          </p>
        </div>
      </section>

      <section class="admin-panel">
        <div class="panel-head">
          <h2>主資料</h2>
          <p>同一個布號只填一次。下面的庫存明細可以連續加很多支。</p>
        </div>

        <form id="rollEntryForm" class="mobile-entry-form">
          <div class="admin-add-grid">
            <label class="field">
              布號
              <input id="baseCode" type="text" placeholder="例如 A023811" required>
            </label>
            <label class="field">
              品名
              <input id="fabricName" type="text" placeholder="例如 原紗布">
            </label>
            <label class="field">
              布種
              <input id="fabricType" type="text" placeholder="例如 針織">
            </label>
            <label class="field">
              花紋 / 顏色
              <input id="pattern" type="text" placeholder="例如 黑色">
            </label>
            <label class="field">
              成份
              <input id="composition" type="text" placeholder="例如 N+OP">
            </label>
            <label class="field">
              幅寬
              <input id="width" type="number" placeholder="例如 60">
            </label>
            <label class="field">
              碼重
              <input id="weightPerYard" type="number" placeholder="例如 320" required>
            </label>
            <label class="field admin-note-field">
              圖片網址備援
              <input id="image" type="text" placeholder="若已有圖片網址可貼這裡">
            </label>
            <label class="field admin-note-field">
              備註
              <input id="note" type="text" placeholder="例如 印花用布 / 對樣中">
            </label>
            <label class="field">
              上傳人
              <input id="uploadedBy" type="text" placeholder="例如 Ricky">
            </label>
          </div>

          <div class="mobile-upload-card">
            <div class="panel-head mobile-upload-head">
              <h2>主照片</h2>
              <p>可直接用手機拍照。系統會先壓縮後再上傳。</p>
            </div>
            <div class="mobile-upload-grid">
              <label class="field">
                拍照 / 選照片
                <input id="imageFile" type="file" accept="image/*" capture="environment">
              </label>
              <button id="clearPhotoButton" class="secondary-button" type="button">清除照片</button>
            </div>
            <div class="mobile-photo-preview-wrap">
              <img id="photoPreview" class="mobile-photo-preview" alt="布料照片預覽" hidden>
              <p id="photoHint" class="upload-note">尚未選擇照片。若用手機開啟，按上方即可直接拍照。</p>
            </div>
          </div>

          <div class="panel-head mobile-roll-head">
            <h2>庫存明細</h2>
            <p>一支布一列。只要輸入公斤數或碼數其中一個，另一個會依碼重自動換算。</p>
          </div>

          <div id="rollRows" class="roll-rows"></div>

          <div class="admin-actions">
            <button id="addRollRowButton" class="secondary-button" type="button">新增一支</button>
            <button id="submitRollsButton" class="primary-button" type="submit">送出入庫</button>
            <button id="clearRollFormButton" class="secondary-button" type="button">清空表單</button>
          </div>
        </form>

        <p id="rollEntryMessage" class="upload-note">登入後可直接用手機拍照並送出入庫。</p>
      </section>
    </main>
  </div>

  <script src="./auth.js"></script>
  <script src="./mobile-entry.js"></script>
</body>
</html>
